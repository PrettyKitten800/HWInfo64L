name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4 & build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libgtk-4-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Clippy (zero-panic + unsafe_code=forbid)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release --workspace

      - name: Fuzz, stress & mini-soak suite
        run: ./scripts/test_robustness.py --skip-live --soak-secs 5
